<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- SEO Metadata -->
    <title>Binit Singh | Full Stack Developer</title>

    <meta
      name="description"
      content="Binit Singh is a Computer Science undergraduate and Full Stack Developer specializing in React, Node.js, Java, REST APIs, MongoDB, MySQL, and scalable web applications."
    />

    <meta
      name="keywords"
      content="Binit Singh, Full Stack Developer, Software Developer, React Developer, Node.js Developer, Java Developer, MERN Stack, Web Development, Portfolio"
    />

    <meta name="author" content="Binit Singh" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <!-- Change this after deploying your own portfolio -->
    <meta property="og:url" content="YOUR_PORTFOLIO_URL" />

    <meta
      property="og:title"
      content="Binit Singh | Full Stack Developer"
    />

    <meta
      property="og:description"
      content="Computer Science undergraduate building full-stack web applications, REST APIs, and database-driven software."
    />

    <meta property="og:image" content="/og-preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />

    <!-- Change this after deploying your own portfolio -->
    <meta property="twitter:url" content="YOUR_PORTFOLIO_URL" />

    <meta
      property="twitter:title"
      content="Binit Singh | Full Stack Developer"
    />

    <meta
      property="twitter:description"
      content="Computer Science undergraduate building full-stack web applications, REST APIs, and database-driven software."
    />

    <meta property="twitter:image" content="/og-preview.png" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cabinet+Grotesk:wght@300;400;500;700;800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <!-- Theme -->
    <script>
      (function () {
        const theme = localStorage.getItem("theme");

        if (theme === "dark" || (!theme && theme !== "light")) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>

    <!-- Global Loader -->
    <style>
      #global-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000000;
        transition: opacity 0.5s ease;
      }

      #global-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="global-loader"></div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
